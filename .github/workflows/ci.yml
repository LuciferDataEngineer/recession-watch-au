name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check src tests
      - name: Unit tests
        run: PYTHONPATH=src pytest -q --ignore=tests/test_browser.py
      - name: Rebuild estimates from the snapshot
        run: PYTHONPATH=src python -m recession_watch run --from-snapshot
      - name: Browser layout
        run: |
          python -m playwright install --with-deps chromium
          PYTHONPATH=src pytest -q tests/test_browser.py tests/test_dashboard.py
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: |
            site/index.html
            data/snapshot/manifest.json
          if-no-files-found: error

  attest:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dashboard
          path: attested
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            attested/site/index.html
            attested/data/snapshot/manifest.json

  verify:
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dashboard
          path: attested
      - name: Verify the dashboard attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh attestation verify attested/site/index.html --repo ${{ github.repository }}
          gh attestation verify attested/data/snapshot/manifest.json --repo ${{ github.repository }}

  kestra:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Run the flow on Kestra
        run: bash scripts/run_kestra.sh
